appId: com.qingzhou.desktop
productName: Qingzhou
copyright: Copyright © 2026 轻舟 / Qingzhou
artifactName: Qingzhou-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - out/main/pty-runtime/**
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**"
  - out/main/pty-runtime/**/*
extraResources:
  - from: ../web/dist
    to: web
  - from: ../server/extensions/approval.ts
    to: approval.ts
afterPack: ./afterPack.mjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  artifactName: Qingzhou-${os}-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Qingzhou
win:
  icon: build/icon.png
  artifactName: Qingzhou-${os}-${arch}.${ext}
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Qingzhou
  artifactName: Qingzhou-${os}-${arch}-setup.${ext}
portable:
  artifactName: Qingzhou-${os}-${arch}-portable.${ext}
npmRebuild: false
