<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f5" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>轻舟</title>
    <script>
      (function () {
        var theme = null;
        try {
          var stored = localStorage.getItem("qingzhou.theme") || localStorage.getItem("mowen.theme") || localStorage.getItem("ohmypi.theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var dark = theme === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.background = dark ? "#18211c" : "#f7f8f5";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#18211c" : "#f7f8f5");

        // Mark Electron shell before React mounts so macOS traffic-light inset
        // CSS applies on first paint (local `pnpm desktop:dev` included).
        var platform = null;
        if (window.qingzhou && window.qingzhou.isDesktop) {
          platform = window.qingzhou.platform || null;
        } else if (/Electron/i.test(navigator.userAgent)) {
          if (/Mac/i.test(navigator.userAgent)) platform = "darwin";
          else if (/Windows/i.test(navigator.userAgent)) platform = "win32";
          else platform = "linux";
        }
        document.documentElement.classList.toggle("desktop", Boolean(platform) || Boolean(window.qingzhou && window.qingzhou.isDesktop));
        if (platform) document.documentElement.dataset.platform = platform;
        else delete document.documentElement.dataset.platform;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
