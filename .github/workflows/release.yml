name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      verify_only:
        description: Exercise Windows native install and signed updates with a temporary test key
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macOS arm64
            artifact: mac-arm64
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-latest
            label: macOS x64
            artifact: mac-x64
            arch: x64
            target: x86_64-apple-darwin
          - runner: windows-latest
            label: Windows x64
            artifact: win-x64
            arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify release build
        if: ${{ !inputs.verify_only || runner.os != 'Windows' }}
        shell: bash
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$VERIFY_ONLY" != "true" ]]; then
            pnpm exec tsx scripts/verify-release-version.ts "$RELEASE_TAG"
          fi
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Verify Windows archive handling
        if: ${{ inputs.verify_only && runner.os == 'Windows' }}
        run: pnpm exec vitest run --config vitest.unit.config.ts tests/unit/pi-search-tools.test.ts

      - name: Exercise Windows WebView2
        if: ${{ runner.os == 'Windows' && !inputs.verify_only }}
        shell: bash
        env:
          QINGZHOU_DESKTOP_E2E_BUILD: "1"
        run: |
          pnpm desktop:pack:tauri x64 win32
          node tests/desktop/tauri-smoke.mjs apps/desktop/src-tauri/target/desktop-e2e/x86_64-pc-windows-msvc/release/qingzhou.exe

      - name: Exercise Windows native unit tests
        if: ${{ runner.os == 'Windows' }}
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Pack desktop app
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          QINGZHOU_TAURI_UPDATE_PUBKEY: ${{ vars.QINGZHOU_TAURI_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$QINGZHOU_TAURI_UPDATE_PUBKEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY"
          pnpm desktop:pack:tauri "${{ matrix.arch }}"

      - name: Build Windows signed update fixtures
        id: windows_fixtures
        if: ${{ inputs.verify_only && runner.os == 'Windows' }}
        shell: bash
        env:
          QINGZHOU_DESKTOP_E2E_UPDATE_URL: http://127.0.0.1:4385/latest.json
          QINGZHOU_DESKTOP_E2E_VERSION: 0.1.27
        run: |
          signing_dir="$(mktemp -d)"
          signing_key="$signing_dir/qingzhou-test.key"
          node apps/desktop/node_modules/@tauri-apps/cli/tauri.js signer generate --ci --password "" --write-keys "$signing_key"
          export QINGZHOU_TAURI_UPDATE_PUBKEY="$(cat "$signing_key.pub")"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$signing_key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" pnpm desktop:pack:win
          test -s apps/desktop/release/Qingzhou-win-x64-setup.exe.sig
          pwsh -NoProfile -File ./tests/desktop/windows-install.ps1 -ReleaseDirectory apps/desktop/release -HistoryFixture .qingzhou-test/windows-legacy-history.json
          QINGZHOU_DESKTOP_E2E_BUILD=1 pnpm --filter @qingzhou/desktop tauri:pack x64 win32

      - name: Verify Windows installed and portable candidates
        if: ${{ runner.os == 'Windows' && !inputs.verify_only }}
        shell: pwsh
        run: ./tests/desktop/windows-install.ps1 -ReleaseDirectory apps/desktop/release

      - name: Replay legacy project history in Windows WebView2
        if: ${{ !cancelled() && steps.windows_fixtures.outcome == 'success' }}
        shell: bash
        run: node tests/desktop/tauri-smoke.mjs apps/desktop/src-tauri/target/desktop-e2e/x86_64-pc-windows-msvc/release/qingzhou.exe .qingzhou-test/windows-legacy-history.json

      - name: Exercise Windows WebView2 recovery and drafts
        if: ${{ !cancelled() && steps.windows_fixtures.outcome == 'success' }}
        shell: bash
        run: node tests/desktop/tauri-smoke.mjs apps/desktop/src-tauri/target/desktop-e2e/x86_64-pc-windows-msvc/release/qingzhou.exe

      - name: Verify bundled Pi with a local Gemini stream
        if: ${{ runner.os == 'Windows' && (!inputs.verify_only || steps.windows_fixtures.outcome == 'success') }}
        shell: bash
        run: pnpm exec tsx tests/integration/gemini-runtime-smoke.ts apps/desktop/src-tauri/target/desktop-e2e/x86_64-pc-windows-msvc/release/runtime

      - name: Verify Windows in-app signed update
        if: ${{ !cancelled() && steps.windows_fixtures.outcome == 'success' }}
        shell: pwsh
        run: |
          node tests/desktop/windows-update.mjs `
            apps/desktop/src-tauri/target/desktop-e2e/x86_64-pc-windows-msvc/release/bundle/nsis/Qingzhou_0.1.27_x64-setup.exe `
            apps/desktop/release/Qingzhou-win-x64-setup.exe

      - name: Verify macOS search tool architecture
        if: ${{ !inputs.verify_only && runner.os == 'macOS' }}
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.artifact == 'mac-arm64' && 'arm64' || 'x86_64' }}
          APP_DIR: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Mowen.app/Contents/Resources/runtime
        run: |
          for tool in fd rg; do
            binary="$APP_DIR/tools/$tool"
            lipo -info "$binary"
            lipo "$binary" -verify_arch "$TARGET_ARCH"
          done
          lipo "$APP_DIR/bin/node" -verify_arch "$TARGET_ARCH"

      - name: Upload artifacts
        if: ${{ !inputs.verify_only }}
        uses: actions/upload-artifact@v5
        with:
          name: qingzhou-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.app.tar.gz
            apps/desktop/release/*.sig

  publish:
    name: Publish GitHub Release
    if: ${{ !inputs.verify_only && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Collect install scripts
        run: |
          mkdir -p dist
          cp scripts/install-macos.sh dist/install-macos.sh
          cp scripts/install-windows.ps1 dist/install-windows.ps1
          chmod +x dist/install-macos.sh
          ls -la dist
          (cd dist && sha256sum *) > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: pnpm/action-setup@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 22
          cache: pnpm

      - name: Write latest.json (Mozi-style updater manifest)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx scripts/write-latest-json.ts "${{ github.ref_name }}" "${{ github.repository }}" dist/SHA256SUMS.txt dist/latest.json CHANGELOG.md
          pnpm exec tsx scripts/write-tauri-update-json.ts "${{ github.ref_name }}" "${{ github.repository }}" dist
          cat dist/latest.json

      - name: Stable release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
