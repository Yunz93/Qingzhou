name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run platform checks without packaging or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macOS arm64
            artifact: mac-arm64
            pack: desktop:pack:mac:arm64
          - runner: macos-latest
            label: macOS x64
            artifact: mac-x64
            pack: desktop:pack:mac:x64
          - runner: windows-latest
            label: Windows x64
            artifact: win-x64
            pack: desktop:pack:win
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install and verify
        shell: bash
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          if [[ "$VERIFY_ONLY" != "true" ]]; then
            pnpm exec tsx scripts/verify-release-version.ts "$RELEASE_TAG"
          fi
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration

      - name: Pack desktop app
        if: ${{ !inputs.verify_only }}
        run: pnpm ${{ matrix.pack }}

      - name: Verify macOS search tool architecture
        if: ${{ !inputs.verify_only && runner.os == 'macOS' }}
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.artifact == 'mac-arm64' && 'arm64' || 'x86_64' }}
          APP_DIR: ${{ matrix.artifact == 'mac-arm64' && 'mac-arm64' || 'mac' }}
        run: |
          for tool in fd rg; do
            binary="apps/desktop/release/$APP_DIR/Qingzhou.app/Contents/Resources/tools/$tool"
            lipo -info "$binary"
            lipo "$binary" -verify_arch "$TARGET_ARCH"
          done

      - name: Upload artifacts
        if: ${{ !inputs.verify_only }}
        uses: actions/upload-artifact@v5
        with:
          name: qingzhou-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

  publish:
    name: Publish GitHub Release
    if: ${{ !inputs.verify_only && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Collect install scripts
        run: |
          mkdir -p dist
          cp scripts/install-macos.sh dist/install-macos.sh
          cp scripts/install-windows.ps1 dist/install-windows.ps1
          chmod +x dist/install-macos.sh
          ls -la dist
          (cd dist && sha256sum *) > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: pnpm/action-setup@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 22
          cache: pnpm

      - name: Write latest.json (Mozi-style updater manifest)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx scripts/write-latest-json.ts "${{ github.ref_name }}" "${{ github.repository }}" dist/SHA256SUMS.txt dist/latest.json CHANGELOG.md
          cat dist/latest.json

      - name: Stable release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
